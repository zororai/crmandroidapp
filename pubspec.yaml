name: yazcrm_beneficiary_flutter
description: Offline beneficiary attendance capture for the CRM.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.4.2
  connectivity_plus: ^6.0.5
  intl: ^0.19.0
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.2.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  workmanager: ^0.10.10
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/data_collection/household_survey.json
    - assets/learning/demo_cohort.json

# App icon: the Youth Advocates logo. Regenerate with
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#6A2C91"
